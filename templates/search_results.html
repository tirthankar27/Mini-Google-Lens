<!DOCTYPE html>
<html>

<head>

<title>Search Results</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{

    background:#202124;
    color:white;

}

.grid{

    display:grid;

    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));

    gap:20px;

}

img{

    width:100%;
    height:220px;

    object-fit:cover;

    border-radius:12px;

}

.card{

    background:#303134;

    border:none;

}

</style>

</head>

<body>

<div class="container py-5">

<h2>

Results for

"<span style="color:#8ab4f8;">{{ query }}</span>"

</h2>

<br>

<div class="grid">

{% for img in images %}

<div class="card p-2">

<img src="{{ img }}">

</div>

{% endfor %}

</div>

<br>

<a
href="/"
class="btn btn-primary"
>

Back

</a>

</div>

</body>

</html>
